<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de conta</title>
</head>
<body>
    <input type="text" name="nome_cliente" placeholder="Digite o seu nome!" required>
    <br>
    <input type= "email" name="email_cliente" placeholder="exemplo@email.com" required>
    <br>
    <input type="password" name="senha_cliente" placeholder="Crie uma senha!" required>

    <br>

    <input type="number" name="cep_cliente" placeholder="CEP ex: 12345678" id="CEP" required>
    <button onclick="bora()">Verificar CEP</button>

    <br>

    <input type="text" name="estado_cliente" placeholder="Digite seu Estado!" id="Estado" required>
    <br>
    <input type="text" name="cidade_cliente" placeholder="Digite sua Cidade!" id="Cidade" required>
    <br>
    <input type="text" name="bairro_cliente" placeholder="Digite seu Bairro!" id="Bairro" required>
    <br>
    <input type="text" name="rua_cliente" placeholder="Digite sua Rua!" id="Logradouro" required> 
    <input type="number" name="numero_da_casa" placeholder="Digite o número da sua casa!" required>
    <br>
    <button type="submit" onclick="">Criar!</button>


    <script src="index.JS"></script>
</body>
</html>
